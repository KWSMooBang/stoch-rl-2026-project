defaults:
  - env/vla_residual_putonplate@env.train
  - env/vla_residual_putonplate@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor: 0   # overridden to the physical GPU by vla_residual/run.sh

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "t022_ppo"
    logger_backends: ["tensorboard"]
  max_epochs: 27
  max_steps: -1
  only_eval: False
  val_check_interval: 9
  save_interval: 27
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 4
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  bootstrap_type: standard
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0
  gamma: 0.96          # per decision (= 0.992 per sim step), same for every algorithm
  gae_lambda: 0.95

env:
  group_name: "EnvGroup"
  eval:
    total_num_envs: 32
    rollout_epoch: 4          # 4 x 32 = the 128 held-out episodes, same ids / pi0.5 noise every evaluation
    auto_reset: True
    ignore_terminations: True # eval episodes always run 16 decisions -> success_once and success_at_end
    max_steps_per_rollout_epoch: 16
    max_episode_steps: 16
    vla_residual:
      split: eval
      squash: tanh
  train:
    total_num_envs: 32
    vla_residual:
      split: train
      squash: tanh
    auto_reset: False          # one synchronized episode (16 decisions) per env per rollout epoch
    ignore_terminations: False # success terminates (sparse +1); loss_mask covers steps after done
    max_steps_per_rollout_epoch: 16
    max_episode_steps: 16
    rollout_epoch: 2           # 2 x 32 envs x 16 decisions = 1024 transitions per update (GRPO: 8 groups of 8)

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False
  model:
    model_type: "mlp_policy"
    model_path: ""
    policy_setup: "panda-ee-dpos"   # prepare_actions passthrough
    obs_dim: 2092                   # VLM17 feature 2048 + qpos 8 + base chunk 35 + t 1
    action_dim: 7
    num_action_chunks: 1
    precision: "32"
    add_value_head: True
    vr_init:
      zero_last: True
      init_logstd: -1.5
  optim:
    lr: 1.0e-4         # smoke: one update at 3e-4 cost -9 pp held-out (paired CI excl. 0); start small
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 0.5
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
