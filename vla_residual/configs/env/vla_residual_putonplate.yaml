# T022: frozen pi0.5 (RLinf-Pi05-ManiSkill-25Main-SFT) inside the env; RL action = 7-D residual per decision.
# env_type stays "maniskill" (action formatting passthrough for policy_setup panda-ee-dpos); the class is swapped by
# vla_residual.rlinf_ext when the vla_residual block is present.
env_type: maniskill
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: False
reward_mode: only_success
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 16   # decisions (1 decision = K=5 sim steps)
max_episode_steps: 16
rollout_epoch: 1
video_cfg:
  save_video: False
  info_on_video: False
  video_base_dir: ${runner.logger.log_path}/video/train
enable_offload: False
vla_residual:
  split: train
  a_pos: 0.02      # m per sim step (x,y,z)
  a_rot: 0.1       # rad per sim step (roll,pitch,yaw)
  a_grip: 2.0      # gripper target units (-1 close .. +1 open): 2.0 can flip the base command
  squash: tanh     # tanh for raw-Gaussian MLP (PPO/GRPO/DAgger), clip for tanh-squashed MLP (SAC/CrossQ)
  max_decisions: 16
  render_skip: True
  expert_label: False
  n_eval: 128
  eval_noise_rep: 0
  noise_steer:     # T039: policy output steers pi0.5's initial flow noise instead of adding an action residual
    mode: none     # none | add (z = z_ref + beta*tanh(u), u=0 -> B0) | replace (z = beta*tanh(u), validation only)
    beta: 1.0
    dims: 7        # model action dims steered (broadcast over the H=8 horizon); others keep z_ref
  zero_vlm: False  # T032 E0: True -> VLM feature block (first 2048 dims of "states") is constant 0; pi0.5 unchanged
init_params:
  id: PutOnPlateInScene25Main-v3
  num_envs: null
