defaults:
  - env/vla_residual_putonplate@env.train
  - env/vla_residual_putonplate@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor: 0   # overridden to the physical GPU by vla_residual/run.sh

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "t022_sac"
    logger_backends: ["tensorboard"]
  max_epochs: 330
  max_steps: -1
  only_eval: False
  val_check_interval: 110
  save_interval: 330
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 64     # 64 transitions per epoch (32 envs x 2 decisions) -> UTD 1, batch 512
  group_size: 1
  agg_q: min
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  bootstrap_type: standard   # no bootstrap through success terminations, bootstrap through truncation
  gamma: 0.96
  tau: 0.005
  train_actor_steps: 30      # replay "trajectories" (= epochs) before the actor trains: critic-only warmup (30x64 updates)
  vr_anchor: 1.0             # actor loss += 1.0 * mean ||tanh(mu)||^2 (T011 value; smoke with 0.1 + 2-epoch warmup collapsed to 3%)
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.001     # T008 lesson: alpha0 on the scale of the reward (sparse 1 per episode)
    target_entropy: -7
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: True
    cache_size: 20000
    sample_window_size: 20000
    min_buffer_size: 4
    auto_save: False
  target_update_freq: 1

env:
  group_name: "EnvGroup"
  eval:
    total_num_envs: 32
    rollout_epoch: 4          # 4 x 32 = the 128 held-out episodes, same ids / pi0.5 noise every evaluation
    auto_reset: True
    ignore_terminations: True # eval episodes always run 16 decisions -> success_once and success_at_end
    max_steps_per_rollout_epoch: 16
    max_episode_steps: 16
    vla_residual:
      split: eval
      squash: clip
  train:
    total_num_envs: 32
    vla_residual:
      split: train
      squash: clip
    auto_reset: True
    ignore_terminations: False
    max_steps_per_rollout_epoch: 2
    max_episode_steps: 16
    rollout_epoch: 1

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 512
  global_batch_size: 512
  seed: 1234
  enable_offload: False
  model:
    model_type: "mlp_policy"
    model_path: ""
    policy_setup: "panda-ee-dpos"   # prepare_actions passthrough
    obs_dim: 2092                   # VLM17 feature 2048 + qpos 8 + base chunk 35 + t 1
    action_dim: 7
    num_action_chunks: 1
    precision: "32"
    add_value_head: False
    add_q_head: True
    vr_init:
      zero_last: True
      init_logstd: -2.0
  optim:
    clip_grad: 10.0
    lr: 1e-4              # actor (critic stays 3e-4)
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
